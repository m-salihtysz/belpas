<header class="custom-header flex align-items-center justify-content-between fixed top-0 left-0 w-full z-5">
    <!-- Logo -->
    <a routerLink="/" class="flex align-items-center gap-2 text-decoration-none z-2">
        <div class="font-bold text-3xl text-white tracking-wider">
            <span>BEL</span><span class="text-white-alpha-70">PAŞ</span>
        </div>
        <div class="hidden md:block text-xs text-white-alpha-80 line-height-1 border-left-1 border-white-alpha-30 pl-2 ml-2">
            Sakarya Büyükşehir<br>Belediyesi
        </div>
    </a>

    <!-- Center Nav with Dropdowns -->
    <nav class="hidden lg:flex align-items-center gap-1 z-2 bg-black-alpha-40 px-3 py-2 border-round-3xl backdrop-blur-md border-1 border-white-alpha-15 shadow-4">
        <a routerLink="/" class="nav-pill" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Ana Sayfa</a>

        <a routerLink="/tesisler" class="nav-pill" routerLinkActive="active">Birimlerimiz</a>

        <a routerLink="/kurumsal/etkinlikler" class="nav-pill" routerLinkActive="active">Etkinliklerimiz</a>

        <a routerLink="/haberler" class="nav-pill" routerLinkActive="active">Haberler</a>

        <!-- Kurumsal Dropdown -->
        <div class="nav-item-dropdown relative group">
            <a routerLink="/kurumsal/hakkimizda" class="nav-pill flex align-items-center gap-1 cursor-pointer" routerLinkActive="active">
                Kurumsal <i class="pi pi-angle-down text-xs ml-1 opacity-70"></i>
            </a>
            <div class="dropdown-menu absolute left-0 top-100 py-2 border-round-2xl shadow-8 border-1 border-white-alpha-15 min-w-16rem z-5">
                <a routerLink="/kurumsal/hakkimizda" class="dropdown-item block px-4 py-2 text-white-alpha-90 hover:text-white hover:bg-white-alpha-10 text-decoration-none transition-colors text-sm font-medium">Hakkımızda</a>
                <a routerLink="/kurumsal/organizasyon-semasi" class="dropdown-item block px-4 py-2 text-white-alpha-90 hover:text-white hover:bg-white-alpha-10 text-decoration-none transition-colors text-sm font-medium">Organizasyon Şeması</a>
                <a routerLink="/kurumsal/kurumsal-kimlik" class="dropdown-item block px-4 py-2 text-white-alpha-90 hover:text-white hover:bg-white-alpha-10 text-decoration-none transition-colors text-sm font-medium">Kurumsal Kimlik</a>
                <a routerLink="/kurumsal/faaliyet-raporu" class="dropdown-item block px-4 py-2 text-white-alpha-90 hover:text-white hover:bg-white-alpha-10 text-decoration-none transition-colors text-sm font-medium">Faaliyet Raporu</a>
            </div>
        </div>

        <!-- Satın Alma Dropdown -->
        <div class="nav-item-dropdown relative group">
            <a routerLink="/ihaleler/ilanlar" class="nav-pill flex align-items-center gap-1 cursor-pointer" routerLinkActive="active">
                Satın Alma <i class="pi pi-angle-down text-xs ml-1 opacity-70"></i>
            </a>
            <div class="dropdown-menu absolute left-0 top-100 py-2 border-round-2xl shadow-8 border-1 border-white-alpha-15 min-w-16rem z-5">
                <a routerLink="/ihaleler/ilanlar" class="dropdown-item block px-4 py-2 text-white-alpha-90 hover:text-white hover:bg-white-alpha-10 text-decoration-none transition-colors text-sm font-medium">Satın Alma İlanları</a>
                <a routerLink="/ihaleler/komisyon" class="dropdown-item block px-4 py-2 text-white-alpha-90 hover:text-white hover:bg-white-alpha-10 text-decoration-none transition-colors text-sm font-medium">Satın Alma Komisyonu</a>
                <a routerLink="/ihaleler/kriterler" class="dropdown-item block px-4 py-2 text-white-alpha-90 hover:text-white hover:bg-white-alpha-10 text-decoration-none transition-colors text-sm font-medium">Satın Alma Kriterleri</a>
                <a routerLink="/ihaleler/surec" class="dropdown-item block px-4 py-2 text-white-alpha-90 hover:text-white hover:bg-white-alpha-10 text-decoration-none transition-colors text-sm font-medium">Satın Alma Süreci</a>
            </div>
        </div>

        <a routerLink="/iletisim" class="nav-pill" routerLinkActive="active">İletişim</a>
    </nav>

    <!-- Right Buttons -->
    <div class="flex align-items-center gap-3 z-2">
        <button class="right-btn border-none cursor-pointer flex align-items-center gap-2 shadow-3 px-4 py-2" (click)="aramaAc()">
            <i class="pi pi-search"></i> Ara
        </button>
        
        <!-- Mobile Menu Toggle -->
        <button class="lg:hidden p-link text-white ml-2">
            <i class="pi pi-bars text-2xl"></i>
        </button>
    </div>
</header>

<p-dialog header="Ne aramak istersiniz?" [(visible)]="aramaAcik" [modal]="true" [style]="{ width: '40rem' }" [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }">
    <div class="flex flex-column gap-3 mb-3">
        <div class="p-inputgroup w-full">
            <span class="p-inputgroup-addon">
                <i class="pi pi-search"></i>
            </span>
            <input type="text" pInputText placeholder="Aramak istediğiniz kelimeyi yazın..." [(ngModel)]="aramaMetni" (keydown.enter)="aramaYap()" autofocus />
            <button pButton type="button" label="Ara" (click)="aramaYap()"></button>
        </div>
    </div>
</p-dialog>
