<section class="form-alani">
  <div class="form-baslik">
    <h2>Görüş ve Önerilerinizi Bize İletin</h2>
    <p>Talepleriniz ve önerileriniz bizim için değerlidir. İletişim formu üzerinden bize kolayca ulaşabilirsiniz.</p>
  </div>

  <div class="form-kart">
    <form>
      <div class="input-grup">
        <input type="text" placeholder="İsim" required>
        <input type="text" placeholder="Soyisim" required>
      </div>
      <input type="email" placeholder="Mail" required>
      <textarea placeholder="Mesajınız" rows="6" required></textarea>
      
      <div class="kvkk-alani">
        <input type="checkbox" id="kvkk" required>
        <label for="kvkk">
          <a href="#">KVKK Aydınlatma Metni</a>'ni okudum ve onaylıyorum.
        </label>
      </div>

      <button type="submit" class="btn-gonder">Mesajınızı Gönderin</button>
    </form>
  </div>
</section>
