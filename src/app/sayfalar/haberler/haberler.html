<div class="kurumsal-alt-sayfa">

  <!-- HERO BANNER -->
  <section class="hero-banner-container mb-6">
    <div class="hero-banner-bg" style="background-image: url('/images/sbb_mekan.jpg');">
      <div class="hero-overlay"></div>
      
      <div class="hero-curved-box p-4 md:p-6">
        <span class="hero-badge mb-2">
          <i class="pi pi-megaphone mr-1"></i> GÜNCEL HABERLER
        </span>
        <h1 class="text-3xl md:text-5xl font-black text-white m-0 mb-3 tracking-tight">Haberler</h1>
        <p class="text-sm md:text-base text-white-alpha-90 m-0 line-height-3 max-w-28rem font-medium">
          BELPAŞ A.Ş. güncel haberleri, sosyal yatırımlar ve resmi kurumsal duyurular.
        </p>
      </div>

      <div class="hero-right-badge hidden lg:flex align-items-center gap-3 p-3 px-4 border-round-3xl bg-white-alpha-20 backdrop-blur border-1 border-white-alpha-30">
        <div class="w-3rem h-3rem border-round-2xl bg-blue-600 text-white flex align-items-center justify-content-center shadow-2">
          <i class="pi pi-rss text-xl"></i>
        </div>
        <div>
          <span class="block text-xs text-white-alpha-80 font-semibold uppercase tracking-wider">Kurumsal Akış</span>
          <span class="block text-sm font-bold text-white">Anlık Duyurular</span>
        </div>
      </div>
    </div>
  </section>

  <div class="container max-w-1100px mx-auto px-4 pb-6">

  <!-- Haberleri Saran Ana Beyaz Kart -->
  <div class="ana-kart">
    
    <div class="haberler-listesi">
      @for (haber of haberler(); track haber.id) {
        <article class="haberler-satiri">
          <div class="haberler-gorsel">
            <img [src]="haber.resimUrl" [alt]="haber.baslik">
          </div>
          <div class="haberler-icerik">
            <h2>{{ haber.baslik }}</h2>
            <p>{{ haber.ozet }}</p>
            <a [routerLink]="['/haberler', haber.slug || haber.id]" class="devamini-oku">Devamını Oku <span>&rarr;</span></a>
          </div>
        </article>
      } @empty {
        <div class="veri-yok">Henüz haber eklenmemiş.</div>
      }
    </div>

  </div>
</div>
